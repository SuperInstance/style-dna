[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "style-dna"
version = "0.1.0"
description = "Musical DNA extraction, analysis, and style morphing system"
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
